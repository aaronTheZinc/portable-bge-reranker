# runpod_config.yaml - Template configuration for RunPod deployment

# Container Configuration
container:
  image: "your-dockerhub-username/bge-reranker:latest"
  registry_auth:
    username: "your-dockerhub-username"
    password: "your-dockerhub-password"

# GPU Configuration
gpu:
  count: 1
  type: "NVIDIA RTX A4000" # or RTX 4090, A100, etc.

# Resource Configuration
resources:
  cpu: 4
  memory: 16 # GB
  disk: 20 # GB

# Environment Variables
env:
  - name: "PYTORCH_CUDA_ALLOC_CONF"
    value: "max_split_size_mb:512"
  - name: "TRANSFORMERS_CACHE"
    value: "/app/cache"
  - name: "HF_HOME"
    value: "/app/cache"

# Ports
ports:
  - containerPort: 8000
    protocol: "http"

# Health Check
health_check:
  path: "/health"
  port: 8000
  interval: 30

# Auto-scaling (for serverless)
scaling:
  min_workers: 0
  max_workers: 10
  scale_up_threshold: 0.8
  scale_down_threshold: 0.2
